<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LAB AR · Grupo 7</title>
<link rel="stylesheet" href="estilo.css">
<script type="importmap">
{ "imports": {
    "three": "./vendor/three/three.module.min.js",
    "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="ar"></div>

<div id="inicio">
  <h1>Edificio de Ingeniería · AR</h1>
  <p>Grupo 7 · Métodos Computacionales en Obras Civiles</p>
  <p id="resumen">cargando el modelo…</p>
  <label class="nota">Elemento
    <select id="conjunto">
      <option value="ar.json">columna 200037 · marcador impreso</option>
      <option value="ar_viga_100161.json">viga 100161 · foto del access point (en terreno)</option>
      <option value="ar_viga_100164.json">viga 100164 · foto del cielo con la X (en terreno)</option>
    </select>
  </label>
  <div class="fila">
    <button class="modo" data-modo="maqueta">Maqueta<br><small>marcador impreso sobre la mesa, 1:50</small></button>
    <button class="modo" data-modo="sitio">En sitio<br><small>apuntando al lugar de la foto, 1:1</small></button>
  </div>
  <p class="nota">Apunta la cámara a la imagen impresa. Safari va a pedir permiso para la cámara.</p>
</div>

<div id="barra">
  <span id="estado">buscando la imagen…</span>
  <span id="pose"></span>
</div>

<div id="panel" hidden>
  <div id="cabeza">
    <b id="titulo"></b>
    <button id="plegar">▾</button>
  </div>
  <div id="cuerpo">
    <div class="controles">
      <label>Caso <select id="caso"></select></label>
      <label>Diagrama <select id="magnitud">
        <option value="Mz">Mz</option><option value="My">My</option>
        <option value="N">N</option><option value="Vy">Vy</option><option value="Vz">Vz</option>
        <option value="T">T</option><option value="">ninguno</option>
      </select></label>
      <label><input type="checkbox" id="deformada"> deformada</label>
      <label><input type="checkbox" id="tributarias"> áreas tributarias</label>
      <label><input type="checkbox" id="etiquetas" checked> tags</label>
      <label>Mostrar <select id="radio"></select></label>
      <label><input type="checkbox" id="ver-calce"> calce a mano</label>
      <label>Si se pierde la imagen <select id="perdida">
        <option value="giroscopio">seguir con el giroscopio</option>
        <option value="congelar">congelar</option>
        <option value="ocultar">ocultar</option>
      </select></label>
    </div>
    <div id="calce" hidden>
      <div class="calce-fila">
        <span>Mover</span>
        <button data-t="x,-1">←</button><button data-t="x,1">→</button>
        <button data-t="y,1">↑</button><button data-t="y,-1">↓</button>
        <button data-t="z,1">acercar</button><button data-t="z,-1">alejar</button>
        <select id="paso"><option value="0.01">1 cm</option><option value="0.05" selected>5 cm</option><option value="0.20">20 cm</option></select>
      </div>
      <div class="calce-fila">
        <span>Girar</span><button data-g="1">⟲ 1°</button><button data-g="-1">⟳ 1°</button>
        <span>Escala</span><button data-s="-1">− 1 %</button><button data-s="1">+ 1 %</button>
        <button id="calce-cero">reiniciar</button>
      </div>
      <p class="nota" id="calce-texto"></p>
    </div>
    <div id="datos"></div>
    <canvas id="pm" width="600" height="360"></canvas>
    <p class="nota" id="origen"></p>
  </div>
</div>

<script type="module" src="ar.js"></script>
</body>
</html>
