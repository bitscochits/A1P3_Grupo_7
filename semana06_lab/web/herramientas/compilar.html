<!doctype html>
<meta charset="utf-8">
<title>Compilar la imagen de referencia</title>
<!--
  Convierte marcador.png en targets.mind: los puntos caracteristicos de la
  imagen, a varias escalas, que MindAR busca en cada cuadro de la camara.
  Lo corre marcador/compilar_marcador.py en Chrome sin ventana; abierto a
  mano (python semana06_lab/servir.py --http) hace lo mismo.
-->
<body style="font-family:system-ui;margin:24px">
<h3>Compilar marcador.png -> targets.mind</h3>
<p id="estado">cargando...</p>
<script type="module">
import { Compiler } from '../vendor/mindar/mindar-image.prod.js';

const estado = document.getElementById('estado');
const decir = (t) => { estado.textContent = t; console.log('COMPILAR ' + t); };

const q = new URLSearchParams(location.search);
// Una o varias imagenes, separadas por coma: el orden es el indice que
// usa ar.js (addAnchor(i)). 0 = el marcador impreso, 1 = la foto del lugar.
const fuentes = (q.get('img') || '../marcador.png').split(',');
const guardar = q.get('guardar') !== '0';
const nombre = q.get('nombre') || 'targets.mind';
const imgs = [];
for (const fuente of fuentes) {
  const img = new Image();
  img.src = fuente + '?' + Date.now();
  await img.decode();
  imgs.push(img);
}
decir('imagenes ' + imgs.map(i => i.naturalWidth + 'x' + i.naturalHeight).join(', ') + ', compilando');

const compiler = new Compiler();
const t0 = performance.now();
const datos = await compiler.compileImageTargets(imgs, (p) => decir('avance ' + p.toFixed(0) + ' %'));
const buffer = await compiler.exportData();
const puntos = datos.map(d => d.trackingData.map(t => t.points.length));
const match = datos.map(d => d.matchingData.map(m => m.maximaPoints.length + m.minimaPoints.length));
decir('listo en ' + ((performance.now() - t0) / 1000).toFixed(1) + ' s; puntos de tracking por escala ' + JSON.stringify(puntos) + '; puntos de deteccion por escala ' + JSON.stringify(match));
if (!guardar) { decir('FIN sin guardar'); throw new Error('fin'); }

const r = await fetch('/guardar?nombre=' + encodeURIComponent(nombre), { method: 'POST', body: buffer });
decir(r.ok ? 'GUARDADO ' + nombre + ' (' + buffer.byteLength + ' bytes)' : 'ERROR al guardar: ' + r.status);
</script>
</body>
